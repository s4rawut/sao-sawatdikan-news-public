# เว็บสวัสดิการ สตง. — docker compose (ทางเลือก)
#   cp .env.example .env   แล้วแก้ค่า
#   docker compose up -d --build
# ข้อมูล: ./data (ฐานข้อมูล + ไฟล์) และ ./backups — สำรองทั้งสองโฟลเดอร์
services:
  web:
    build:
      context: .
      args:
        SITE_URL: ${SITE_URL}
        ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 4321
      DATABASE_PATH: /app/data/emdash.db
      UPLOADS_DIR: /app/data/uploads
      SESSIONS_DIR: /app/data/sessions
      BACKUP_DIR: /app/backups
    ports:
      - "127.0.0.1:4321:4321"   # ให้ nginx บนเครื่องเป็นตัวรับ https (deploy/nginx.conf)
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
    restart: unless-stopped
