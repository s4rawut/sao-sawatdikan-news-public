# nginx reverse proxy — เว็บสวัสดิการ สตง.
# วางที่ /etc/nginx/sites-available/sao-welfare แล้ว ln -s ไป sites-enabled · แก้ server_name และไฟล์ใบรับรอง
server {
    listen 80;
    server_name welfare.example.go.th;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name welfare.example.go.th;

    ssl_certificate     /etc/ssl/certs/welfare.example.go.th.crt;
    ssl_certificate_key /etc/ssl/private/welfare.example.go.th.key;

    # ไฟล์แนบระเบียบ (PDF สแกน) ได้ถึง 20 MB
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # IP ผู้ใช้จริง: ใช้จำกัดการเดารหัสผ่าน (ต้องเขียนทับค่าที่ผู้ใช้ส่งมาเสมอ)
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # WebSocket (การแก้ไขพร้อมกันในหลังบ้าน EmDash)
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 120s;
    }
}

# ใส่ไว้ใน http { } ครั้งเดียว (ถ้ายังไม่มี)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
